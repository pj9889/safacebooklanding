<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat with Jacklyn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; color: #fff; overflow: hidden;
        }
        .container { 
            width: 90%; max-width: 380px; text-align: center; 
            background: rgba(255, 255, 255, 0.03); padding: 50px 25px; 
            border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .profile-pic { 
            width: 130px; height: 130px; border-radius: 50%; 
            object-fit: cover; border: 4px solid #0084ff; 
            margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 132, 255, 0.4);
        }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .status { color: #22c55e; font-size: 14px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .live-dot { height: 8px; width: 8px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .btn-chat { 
            width: 100%; background: linear-gradient(135deg, #0084ff 0%, #00c6ff 100%); 
            color: white; padding: 18px; border-radius: 20px; 
            font-weight: 800; font-size: 19px; border: none; 
            cursor: pointer; display: flex; align-items: center; 
            justify-content: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 132, 255, 0.4);
        }
        @keyframes highShake {
            0%, 100% { transform: scale(1); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(8px) rotate(2deg); }
        }
        .shake-now { animation: highShake 0.6s ease-in-out; }
        #dynamic-text { margin-top: 25px; font-weight: 600; font-size: 18px; height: 30px; color: #00c6ff; opacity: 0; transition: opacity 0.4s; }
    </style>
</head>
<body>
    <div class="container">
        <img src="profile.webp" class="profile-pic" alt="Profile">
        <h1>Jacklyn Rose <i class="fa-solid fa-circle-check" style="color:#0084ff;"></i></h1>
        <div class="status"><span class="live-dot"></span> Active Now</div>
        <button id="chatBtn" class="btn-chat" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> START PRIVATE CHAT
        </button>
        <div id="dynamic-text"></div>
    </div>

    <script>
        const TARGET_URL = 'safeoffers.pro/a/RozKiOzWhOXLZ'; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxo8ZyK3hi3-dfFaSu-_ZbUDPudyXMWdAN5LCI92to2qTUEjVTp7B4Yshp44sgEXwjm/exec';

        // ডাটা পাঠানোর সবচেয়ে নির্ভরযোগ্য উপায়
        function sendEvent(type) {
            var img = new Image();
            img.src = SCRIPT_URL + "?event=" + type;
        }

        window.onload = () => {
            sendEvent('Total_Visit');
            const textElement = document.getElementById('dynamic-text');
            const btn = document.getElementById('chatBtn');
            const messages = ["What You Need?😈", "I Have it!😜", "Just Message \"Hi\" Here👆"];
            let i = 0;
            setInterval(() => {
                textElement.style.opacity = 0;
                setTimeout(() => {
                    textElement.innerText = messages[i];
                    textElement.style.opacity = 1;
                    if (i === 2) {
                        btn.classList.add('shake-now');
                        setTimeout(() => btn.classList.remove('shake-now'), 700);
                    }
                    i = (i + 1) % messages.length;
                }, 400);
            }, 2000);
        };

        function handleStartChat() {
            sendEvent('Button_Click');
            const ua = navigator.userAgent;
            const isFB = /FBAN|FBAV|Instagram/i.test(ua);
            const isAndroid = /Android/i.test(ua);
            const chromeIntent = "intent://" + TARGET_URL + "#Intent;scheme=https;package=com.android.chrome;end";
            
            setTimeout(() => {
                window.location.href = (isFB && isAndroid) ? chromeIntent : "https://" + TARGET_URL;
            }, 400);
        }
    </script>
</body>
</html>
