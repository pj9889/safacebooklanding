<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat with Jacklyn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow: hidden; }
        .container { width: 90%; max-width: 380px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 40px 20px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #0084ff; margin-bottom: 15px; }
        .btn-chat { width: 100%; background: linear-gradient(135deg, #0084ff, #00c6ff); color: white; padding: 18px; border-radius: 50px; font-weight: bold; font-size: 18px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 20px rgba(0, 132, 255, 0.3); }
        @keyframes highShake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50% { transform: translateX(-10px); } 20%, 40%, 60% { transform: translateX(10px); } }
        .shake-now { animation: highShake 0.6s ease-in-out; }
        #dynamic-text { margin-top: 20px; font-weight: 600; color: #00c6ff; height: 25px; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <img src="profile.webp" class="profile-pic">
        <h1 style="font-size: 24px;">Jacklyn Rose <i class="fa-solid fa-circle-check" style="color:#0084ff;"></i></h1>
        <p style="color: #22c55e; margin: 10px 0;">● Active Now</p>
        <button id="chatBtn" class="btn-chat" onclick="handleStartChat()">START PRIVATE CHAT</button>
        <div id="dynamic-text"></div>
    </div>

    <script>
        const TARGET_URL = 'safeoffers.pro/a/RozKiOzWhOXLZ'; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrztddsDdFWobUBtsyX64ztlMbW0WR9XIHSzP3Z3jz2H8NjJ1Fe8teVqRfFMbSUfxk/exec';

        async function sendEvent(type) {
            try {
                await fetch(SCRIPT_URL + "?event=" + type, { method: 'GET', mode: 'no-cors' });
            } catch (e) { console.log(e); }
        }

        window.onload = () => {
            sendEvent('Total_Visit');
            let messages = ["What You Need?😈", "I Have it!😜", "Just Message \"Hi\" Here👆"];
            let i = 0;
            setInterval(() => {
                const txt = document.getElementById('dynamic-text');
                const btn = document.getElementById('chatBtn');
                txt.style.opacity = 0;
                setTimeout(() => {
                    txt.innerText = messages[i];
                    txt.style.opacity = 1;
                    if (i === 2) {
                        btn.classList.add('shake-now');
                        setTimeout(() => btn.classList.remove('shake-now'), 600);
                    }
                    i = (i + 1) % messages.length;
                }, 300);
            }, 2000);
        };

        function handleStartChat() {
            sendEvent('Button_Click');
            const isFB = /FBAN|FBAV|Instagram/i.test(navigator.userAgent);
            const chromeIntent = "intent://" + TARGET_URL + "#Intent;scheme=https;package=com.android.chrome;end";
            setTimeout(() => {
                window.location.href = (isFB && /Android/i.test(navigator.userAgent)) ? chromeIntent : "https://" + TARGET_URL;
            }, 400);
        }
    </script>
</body>
</html>
