<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Connect - Community Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow: hidden; }
        .container { width: 92%; max-width: 380px; text-align: center; background: rgba(255, 255, 255, 0.04); padding: 40px 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .match-area { position: relative; width: 140px; height: 140px; margin: 0 auto 25px; border-radius: 50%; padding: 4px; background: linear-gradient(45deg, #0084ff, #00c6ff); box-shadow: 0 0 20px rgba(0, 132, 255, 0.4); overflow: hidden; }
        .profile-slider { display: flex; width: 1400px; height: 100%; will-change: transform; }
        .profile-slider img { width: 140px; height: 132px; object-fit: cover; border-radius: 50%; display: block; }
        h1 { font-size: 22px; margin-bottom: 8px; font-weight: 600; }
        #match-status { color: #00c6ff; font-weight: 600; font-size: 17px; margin-bottom: 25px; height: 26px; }
        .btn-chat { width: 100%; background: linear-gradient(135deg, #0084ff 0%, #00c6ff 100%); color: white; padding: 18px; border-radius: 18px; font-weight: 800; font-size: 18px; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 20px rgba(0, 132, 255, 0.3); animation: pulse-btn 1.5s infinite; }
        @keyframes pulse-btn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .loader { border: 3px solid rgba(255, 255, 255, 0.2); border-top: 3px solid #0084ff; border-radius: 50%; width: 25px; height: 25px; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="match-area">
            <div class="profile-slider" id="slider">
                <img src="p1.webp" loading="eager">
                <img src="p2.webp" loading="eager">
                <img src="p3.webp" loading="eager">
                <img src="p4.webp" loading="eager">
                <img src="p5.webp" loading="eager">
                <img src="p6.webp" loading="eager">
                <img src="p7.webp" loading="eager">
                <img src="p8.webp" loading="eager">
                <img src="p9.webp" loading="eager">
                <img src="p10.webp" loading="eager">
            </div>
        </div>
        <h1 id="title">Finding New Friends...</h1>
        <div id="match-status"><div class="loader"></div></div>
        <button id="chatBtn" class="btn-chat" onclick="handleStartChat()">
            <i class="fa-brands fa-facebook-messenger"></i> START CHAT NOW
        </button>
    </div>
    <script>
        const TARGET_URL = 'safeoffers.pro/a/RozKiOzWhOXLZ'; 
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxo8ZyK3hi3-dfFaSu-_ZbUDPudyXMWdAN5LCI92to2qTUEjVTp7B4Yshp44sgEXwjm/exec';
        function sendEvent(type) { new Image().src = SCRIPT_URL + "?event=" + type; }
        const slider = document.getElementById('slider');
        const statusText = document.getElementById('match-status');
        const title = document.getElementById('title');
        const chatBtn = document.getElementById('chatBtn');
        let position = 0;
        let count = 0;
        const interval = setInterval(() => {
            position -= 140;
            if (position <= -1400) position = 0;
            slider.style.transform = `translateX(${position}px)`;
            count++;
            if (count > 25) { 
                clearInterval(interval);
                finalizeMatch();
            }
        }, 110);
        function finalizeMatch() {
            const targetPos = -560; 
            slider.style.transition = "transform 0.7s cubic-bezier(0.17, 0.67, 0.83, 0.67)";
            slider.style.transform = `translateX(${targetPos}px)`;
            setTimeout(() => {
                title.innerText = "Congratulations! 🥳";
                statusText.innerHTML = "<span style='color:#22c55e;'>Your Free Match Found!</span>";
                chatBtn.style.display = "flex";
                confetti({ particleCount: 100, spread: 60, origin: { y: 0.7 } });
                sendEvent('Fixed_Match_Found');
            }, 800);
        }
        window.onload = () => { sendEvent('Total_Visit'); };
        function handleStartChat() {
            sendEvent('Button_Click');
            const isAndroid = /Android/i.test(navigator.userAgent);
            const chromeIntent = `intent://${TARGET_URL}#Intent;scheme=https;package=com.android.chrome;end`;
            setTimeout(() => { window.location.href = isAndroid ? chromeIntent : `https://${TARGET_URL}`; }, 300);
        }
    </script>
</body>
</html>
